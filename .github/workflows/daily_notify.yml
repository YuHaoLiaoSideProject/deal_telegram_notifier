name: 每日福利好康通知

on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 02:00 = 台北 10:00
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行通知
        env:
          # Secrets（敏感資料）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Variables（非敏感，Repo → Settings → Variables → Actions）
          TELEGRAM_THREAD_ID_DEAL: ${{ vars.TELEGRAM_THREAD_ID_DEAL }}
        run: python -m src.main

      - name: 提交已通知記錄，確保持續性
        run: |
          if [ -f data/sent_deals.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/sent_deals.json
            if git diff --cached --quiet; then
              echo "無變更，跳過提交"
            else
              git commit -m "chore: 更新已通知記錄 [skip ci]"
              git push
            fi
          else
            echo "data/sent_deals.json 不存在，跳過提交"
          fi
